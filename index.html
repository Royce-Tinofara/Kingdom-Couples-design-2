<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom Couples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#001C41; --gold:#C29F34;
  --bg:#FFFFFF; --ink:#0A1A33; --muted:#51607A; --soft:#F1F3F8; --line:#D5DBE6;
  --gold-ink:#86691A; --accent:#001C41;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#030A16; --ink:#EEF1F7; --muted:#A4AEC2; --soft:#08142B; --line:#1B2B4A;
    --gold-ink:#D2B25A; --accent:#D2B25A;
  }
}
:root[data-theme="dark"]{
  --bg:#030A16; --ink:#EEF1F7; --muted:#A4AEC2; --soft:#08142B; --line:#1B2B4A;
  --gold-ink:#D2B25A; --accent:#D2B25A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(68px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:1.0625rem;line-height:1.75}
h1,h2,h3{font-family:"Newsreader",Georgia,serif;font-weight:500;margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:0 0 1.1em;max-width:58ch}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#app:focus{outline:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 1.75rem}
.pad{padding:6.5rem 0}
.soft{background:var(--soft)}

/* header */
header.top{position:sticky;top:0;z-index:10;background:var(--navy);color:#F4F1E8;padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;font-family:"Newsreader",serif;font-weight:600;font-size:1.3rem;color:var(--gold);letter-spacing:.01em}
.brand svg{height:34px;width:auto;display:block}
nav{display:flex;gap:1.9rem}
nav a{position:relative;text-decoration:none;font-size:.95rem;letter-spacing:.02em;opacity:.9;padding:.3rem 0}
nav a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
nav a:hover{opacity:1;color:var(--gold)}
nav a:hover::after,nav a[aria-current="page"]::after{transform:scaleX(1)}
nav a[aria-current="page"]{opacity:1;color:var(--gold)}
@media(max-width:640px){nav{gap:1rem}nav a{font-size:.88rem}.brand .nm{display:none}}

/* shared pieces */
.ln{display:block;width:64px;height:2px;background:var(--gold);margin-top:1.5rem;transform:scaleX(0);transform-origin:left;transition:transform .9s cubic-bezier(.2,.7,.2,1) .15s}
.ln.in{transform:scaleX(1)}
.ln.c{margin-left:auto;margin-right:auto;transform-origin:center}
.dl{position:relative}
.dl::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--dh,1px);background:var(--dc,var(--line));transform:scaleX(0);transform-origin:left;transition:transform 1s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*110ms)}
.dl.in::before{transform:scaleX(1)}
.endline{height:1px;background:var(--line);transform:scaleX(0);transform-origin:left;transition:transform 1s cubic-bezier(.2,.7,.2,1) .2s}
.endline.in{transform:scaleX(1)}
h2{font-size:clamp(2.1rem,4.4vw,3.2rem)}
.btn{display:inline-block;padding:.85rem 1.8rem;border-radius:2px;font-weight:600;font-size:.98rem;letter-spacing:.03em;text-decoration:none;border:1px solid var(--gold)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.gold:hover{background:#D3B04A}
.btn.line{color:#F4F1E8}
.btn.line:hover{background:rgba(244,241,232,.1)}
.more{display:inline-block;font-weight:600;color:var(--accent);text-underline-offset:5px}
.cta{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:2.4rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start}
@media(max-width:800px){.two{grid-template-columns:1fr;gap:2rem}.pad{padding:4.5rem 0}}
.statement{font-family:"Newsreader",serif;font-weight:400;font-size:clamp(1.45rem,2.6vw,1.95rem);line-height:1.4;margin:2rem 0 0;max-width:26ch}
.muted{color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:2.5rem;margin-top:4rem}
.col{padding-top:1.3rem}
.col h3{font-size:1.5rem;margin-bottom:.6rem}
.col p{color:var(--muted);font-size:1rem;line-height:1.65;margin:0}
@media(max-width:900px){.cols{grid-template-columns:repeat(2,1fr);gap:2.5rem 2rem}}
@media(max-width:560px){.cols{grid-template-columns:1fr}}

/* page header band */
.phead{background:var(--navy);color:#F4F1E8;padding:5rem 0 4.2rem}
.phead h1{font-size:clamp(2.6rem,6vw,4.2rem);font-weight:500}
.phead p{color:#D5DAE6;font-size:1.15rem;margin:1.2rem 0 0}

/* hero */
.hero{background:var(--navy);color:#F4F1E8;text-align:center}
.hero .wrap{padding-top:3.5rem;padding-bottom:5rem;display:flex;flex-direction:column;align-items:center}
.hero h1{margin:0;cursor:pointer}
.lg{display:block;width:min(400px,76vw);height:auto;overflow:visible}
.lg path{fill:var(--gold);fill-opacity:0;fill-rule:evenodd;stroke:var(--gold);stroke-width:2.4;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:lgdraw var(--du,1.2s) cubic-bezier(.45,0,.25,1) var(--dl,0s) forwards,lgfill .9s ease 2.3s forwards}
@keyframes lgdraw{to{stroke-dashoffset:0}}
@keyframes lgfill{to{fill-opacity:1;stroke-opacity:0}}
.tagline{width:100%;display:flex;align-items:center;justify-content:center;gap:1.4rem;margin:1.8rem 0 0;max-width:none;font-family:"Newsreader",serif;font-weight:500;font-size:clamp(1.2rem,2.8vw,1.65rem);color:var(--gold)}
.tagline span{text-wrap:balance;text-align:center;opacity:0;transform:translateY(8px);animation:rise .9s ease 2.4s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.fl{flex:1;max-width:130px;height:1px;background:var(--gold);transform:scaleX(0);transition:transform 1s cubic-bezier(.2,.7,.2,1) .3s}
.fl.l{transform-origin:right}.fl.r{transform-origin:left}
.hero .fl{transition:none;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) 2.5s forwards}
@keyframes grow{to{transform:scaleX(1)}}
.in>.fl,.fl.in{transform:scaleX(1)}
@media(max-width:620px){.hero .fl{display:none}}
.next{position:relative;margin-top:3.2rem;padding-top:1.4rem;font-size:.98rem;width:100%;max-width:540px}
.next::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:rgba(194,159,52,.6);transform:scaleX(0);transform-origin:center;animation:grow 1.2s ease 2.8s forwards}
.next a{color:var(--gold);text-underline-offset:5px}

/* events */
.tabs{display:flex;gap:1.6rem}
.tabs button{font:inherit;font-size:.98rem;letter-spacing:.02em;padding:.3rem 0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.head-row{display:flex;justify-content:space-between;align-items:end;gap:1.5rem;flex-wrap:wrap}
.event-list{list-style:none;margin:3rem 0 0;padding:0}
.event{display:grid;grid-template-columns:150px 1fr auto;gap:2.2rem;align-items:start;padding:2.2rem 0}
.date{font-family:"Newsreader",serif;font-size:2.5rem;font-weight:500;line-height:1}
.date span{display:block;font-family:"Hanken Grotesk",sans-serif;font-weight:400;font-size:.9rem;color:var(--muted);margin-top:.5rem;letter-spacing:.04em}
.event h3{font-size:1.65rem;margin-bottom:.4rem}
.event .meta{color:var(--gold-ink);font-weight:600;font-size:.95rem;margin-bottom:.5rem}
.event p{color:var(--muted);margin:0}
.event a.cal{font-size:.95rem;text-underline-offset:5px;color:var(--accent);white-space:nowrap;font-weight:500}
.empty{padding:2rem 0;color:var(--muted)}
@media(max-width:700px){.event{grid-template-columns:1fr;gap:.9rem;padding:1.8rem 0}}

/* verse band */
.band{background:var(--navy);color:#F4F1E8;text-align:center;padding:5.5rem 0}
.vb{display:flex;align-items:center;justify-content:center;gap:1.6rem}
.band blockquote{margin:0;font-family:"Newsreader",serif;font-style:italic;font-weight:400;font-size:clamp(1.5rem,3.4vw,2.4rem);line-height:1.3;color:var(--gold);max-width:22ch}
.band cite{display:block;margin-top:1.2rem;font-family:"Hanken Grotesk",sans-serif;font-style:normal;font-size:.9rem;letter-spacing:.05em;color:#D5DAE6}
@media(max-width:620px){.vb .fl{display:none}}

/* steps */
.steps{position:relative;margin-top:2.5rem;padding-left:2.8rem;max-width:620px}
.steps::before{content:"";position:absolute;left:.6rem;top:.7rem;bottom:.7rem;width:2px;background:var(--gold);transform:scaleY(0);transform-origin:top;transition:transform 1.6s cubic-bezier(.4,0,.2,1)}
.steps.in::before{transform:scaleY(1)}
.step{position:relative;padding-bottom:2rem}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:-2.8rem;top:.55rem;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.step h3{font-size:1.4rem;margin-bottom:.3rem}
.step p{color:var(--muted);margin:0}

/* faq */
.faq{margin-top:2.5rem;max-width:760px}
.faq details{padding:1.2rem 0}
.faq summary{cursor:pointer;font-family:"Newsreader",serif;font-weight:500;font-size:1.3rem}
.faq details p{margin:.8rem 0 0;color:var(--muted)}

/* contact */
.contact{background:var(--navy);color:#F4F1E8;padding:3rem 2.6rem;max-width:620px}
.contact h3{font-size:2rem;margin-bottom:1rem;color:var(--gold)}
.contact p{color:#D5DAE6;max-width:40ch}
.contact .btn{background:var(--gold);color:var(--navy);margin-top:.6rem}
.contact .btn:hover{background:#D3B04A}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .contact{border:1px solid var(--line)}}

/* page enter */
#app.enter{animation:pg .5s ease both}
@keyframes pg{from{opacity:0;transform:translateY(10px)}}

footer{border-top:1px solid rgba(194,159,52,.35);background:var(--navy);color:#F4F1E8;text-align:center;padding:4rem 0 3rem}
footer svg{height:64px;width:auto}
footer .mark{font-family:"Newsreader",serif;font-weight:600;font-size:1.8rem;color:var(--gold);margin-top:.8rem}
footer .row{margin-top:1.2rem;font-size:.92rem;opacity:.9}
footer nav{justify-content:center;margin-top:1.4rem;flex-wrap:wrap}
footer a{color:var(--gold);text-underline-offset:5px}
footer nav a{color:#F4F1E8}

@media(prefers-reduced-motion:reduce){
  .lg path{animation:none;stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0}
  .tagline span{animation:none;opacity:1;transform:none}
  .hero .fl,.next::before{animation:none;transform:none}
  #app.enter{animation:none}
  *,*::before,*::after{transition:none!important}
  .ln,.dl::before,.endline,.fl,.steps::before{transform:none}
}

/* A fresh, warm editorial identity */
:root{
  --navy:#203b33;--gold:#b87550;
  --bg:#faf8f3;--ink:#26342e;--muted:#66736b;--soft:#f0eee6;--line:#deded3;
  --gold-ink:#9a5938;--accent:#34594b;
}
:root[data-theme="dark"]{
  --bg:#18251f;--ink:#f3efe5;--muted:#bbc3b9;--soft:#202f28;--line:#3b4b42;
  --gold-ink:#e4aa83;--accent:#b9d0bf;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#18251f;--ink:#f3efe5;--muted:#bbc3b9;--soft:#202f28;--line:#3b4b42;
    --gold-ink:#e4aa83;--accent:#b9d0bf;
  }
}
html{scroll-padding-top:76px}
body{font-size:1rem;line-height:1.75;background:var(--bg);color:var(--ink)}
h1,h2,h3{letter-spacing:-.035em}
h2{font-size:clamp(2.2rem,4.7vw,3.6rem)}
.wrap{max-width:1180px;padding-inline:2rem}
.pad{padding:6rem 0}
header.top{background:var(--bg);color:var(--ink);box-shadow:0 1px 0 var(--line)}
header.top .wrap{height:76px}
.brand{color:var(--ink);font-family:"Hanken Grotesk",sans-serif;font-size:1rem;font-weight:600;letter-spacing:.015em}
.brand svg{height:34px;filter:none}
nav{gap:1.7rem}
nav a{font-size:.9rem;color:var(--ink)}
nav a:hover,nav a[aria-current="page"]{color:var(--gold-ink)}
.nav-actions{display:flex;align-items:center;gap:.8rem}
.theme-toggle,.menu-toggle{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer;border-radius:999px}
.theme-toggle{width:40px;height:40px;font-size:1rem}
.menu-toggle{display:none;padding:.5rem .85rem;font-size:.85rem}
.hero{position:relative;overflow:hidden;background:var(--navy);color:#f8f4eb;text-align:left}
.hero::after{content:"";position:absolute;width:38rem;height:38rem;border:1px solid rgba(235,201,157,.18);border-radius:50%;right:-12rem;top:-19rem;box-shadow:0 0 0 42px rgba(235,201,157,.035),0 0 0 84px rgba(235,201,157,.025);pointer-events:none}
.hero .wrap{position:relative;z-index:1;min-height:590px;padding-top:5rem;padding-bottom:5rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.82fr);grid-template-rows:auto auto auto;align-content:center;align-items:center;column-gap:4rem}
.hero h1{grid-column:2;grid-row:1 / span 3;justify-self:center;cursor:default}
.lg{width:min(390px,34vw)}
.lg path{fill:#d7b47b;stroke:#e9d2a6}
.tagline{grid-column:1;grid-row:1;display:block;margin:0 0 1.3rem;color:#e4bd8c;text-align:left;font-family:"Hanken Grotesk",sans-serif;font-weight:600;font-size:.77rem;letter-spacing:.15em;text-transform:uppercase}
.tagline .fl{display:none}
.hero-copy{grid-column:1;grid-row:2}
.hero-copy .eyebrow{color:#dcc29c}
.hero-copy h2{max-width:12ch;font-size:clamp(2.8rem,5.7vw,5rem);letter-spacing:-.045em;line-height:1.05}
.hero-copy p{max-width:43ch;color:#e0e4dc;margin:1.2rem 0 0}
.hero .cta{grid-column:1;grid-row:3;justify-content:flex-start;margin-top:1.8rem}
.btn{border-radius:999px;padding:.8rem 1.35rem;letter-spacing:0;transition:transform .2s ease,background .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:#d5ad78;color:#203b33;border-color:#d5ad78}
.btn.line{border-color:rgba(248,244,235,.55);color:#f8f4eb}
.next{grid-column:1 / -1;grid-row:4;justify-self:start;margin-top:2.8rem;padding-top:1rem;border-top:1px solid rgba(248,244,235,.2);color:#dfe5dc}
.next::before{display:none}
.next a{color:#e9c99e}
.eyebrow{margin:0 0 .75rem;color:var(--gold-ink);font-size:.75rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase}
.ln{width:48px;margin-top:1.15rem}
.statement{font-size:clamp(1.5rem,2.6vw,2rem)}
.cols{gap:1.25rem;margin-top:3rem}
.col{padding:1.5rem 1.4rem;background:var(--bg);border:1px solid var(--line);border-radius:16px}
.col h3{font-size:1.35rem}
.soft{background:var(--soft)}
.event-list{margin-top:2.5rem}
.event{grid-template-columns:100px minmax(0,1fr) auto;gap:1.5rem;padding:1.7rem 1.4rem;margin-bottom:1rem;background:var(--bg);border:1px solid var(--line);border-radius:16px}
.event .date{font-size:1.65rem;color:var(--accent)}
.event h3{font-size:1.35rem}
.event .meta{color:var(--gold-ink)}
.event a.cal{padding:.65rem .9rem;border:1px solid var(--line);border-radius:999px;text-decoration:none}
.event a.cal:hover{border-color:var(--gold);color:var(--gold-ink)}
.band{background:#e9e4d8;color:#34453b;padding:4.5rem 0}
:root[data-theme="dark"] .band{background:#26372d;color:#f3efe5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .band{background:#26372d;color:#f3efe5}}
.vb blockquote{font-family:"Newsreader",serif;font-size:clamp(1.8rem,3.4vw,2.65rem)}
.vb cite{font-family:"Hanken Grotesk",sans-serif;color:var(--gold-ink)}
.contact{border-radius:20px}
.faq details{border-bottom:1px solid var(--line)}
.reflection{max-width:42rem;margin:2rem auto 0;text-align:center;color:var(--muted);font-size:.95rem}
.skip-link{position:fixed;z-index:30;top:.75rem;left:.75rem;padding:.7rem 1rem;border-radius:8px;background:var(--bg);color:var(--ink);transform:translateY(-160%)}
.skip-link:focus{transform:translateY(0)}
.event-tools{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.event-search{width:min(100%,320px);padding:.75rem 1rem;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit}
.event-search::placeholder{color:var(--muted)}
.event-search:focus-visible,.theme-toggle:focus-visible,.menu-toggle:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
footer{background:#203b33;border-top:0}
@media(max-width:760px){
  .wrap{padding-inline:1.25rem}
  .pad{padding:4.25rem 0}
  header.top .wrap{height:68px}
  .menu-toggle{display:inline-flex;align-items:center;gap:.4rem}
  .nav-actions{gap:.5rem}
  nav#mainNav{display:none;position:absolute;top:100%;left:0;right:0;padding:1rem 1.25rem 1.4rem;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 14px 20px rgba(24,35,29,.08);flex-direction:column;align-items:stretch;gap:.15rem}
  nav#mainNav.is-open{display:flex}
  nav#mainNav a{padding:.65rem .35rem}
  .event-tools{align-items:stretch}
  .event-search{width:100%}
  .hero .wrap{min-height:auto;padding-top:4rem;padding-bottom:3rem;grid-template-columns:minmax(0,1fr) 130px;column-gap:.5rem}
  .hero h1{grid-column:2;grid-row:2}
  .lg{width:min(160px,34vw)}
  .tagline{grid-column:1 / -1;grid-row:1}
  .hero-copy{grid-column:1;grid-row:2}
  .hero-copy h2{font-size:clamp(2.4rem,8vw,3.7rem)}
  .hero .cta{grid-column:1 / -1;grid-row:3}
  .next{grid-row:4}
  .event{grid-template-columns:75px 1fr;gap:.9rem}
  .event a.cal{grid-column:2;justify-self:start}
}
@media(max-width:430px){
  .brand .nm{display:inline;font-size:.9rem}
  .brand{gap:.45rem}
  .brand svg{height:29px}
  .theme-toggle{width:36px;height:36px}
  .hero .wrap{grid-template-columns:minmax(0,1fr) 92px}
  .lg{width:110px}
  .hero-copy h2{font-size:2.55rem}
  .hero .cta{gap:.65rem}
  .hero .btn{font-size:.88rem;padding:.7rem .95rem}
}
</style>
</head>

/* ----- helpers ----- */
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const today=new Date(); today.setHours(0,0,0,0);
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sorted=v=>EVENTS.filter(e=>v==="upcoming"?parse(e.date)>=today:parse(e.date)<today)
  .sort((a,b)=>v==="upcoming"?parse(a.date)-parse(b.date):parse(b.date)-parse(a.date));
function calLink(e){
  const d=parse(e.date), p=n=>String(n).padStart(2,"0");
  const f=x=>x.getFullYear()+p(x.getMonth()+1)+p(x.getDate());
  const n=new Date(d); n.setDate(n.getDate()+1);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(e.title)+
    "&dates="+f(d)+"/"+f(n)+"&location="+encodeURIComponent(e.place)+"&details="+encodeURIComponent(e.text+" (Time: "+e.time+")");
}
function eventRows(items,view,empty){
  if(!items.length) return '<li class="empty">'+empty+'</li>';
  return items.map((e,i)=>{
    const d=parse(e.date);
    return '<li class="event dl rv" style="--i:'+i+'"><div class="date">'+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)+'<span>'+d.getFullYear()+'</span></div>'+
      '<div><h3>'+esc(e.title)+'</h3><div class="meta">'+esc(e.time)+', '+esc(e.place)+'</div><p>'+esc(e.text)+'</p></div>'+
      (view==="upcoming"?'<a class="cal" href="'+calLink(e)+'" target="_blank" rel="noopener">Add to calendar</a>':'<span></span>')+'</li>';
  }).join("")+'<li class="endline rv" aria-hidden="true"></li>';
}
const noUp="No upcoming events right now. Follow our Facebook page to hear first when the next one is announced.";

function watch(root){
  const els=[...root.querySelectorAll(".rv")];
  if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return}
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}}),{threshold:.15,rootMargin:"0px 0px -4% 0px"});
  els.forEach(e=>io.observe(e));
}
const phead=(t,sub)=>'<div class="phead"><div class="wrap"><h1>'+t+'</h1><span class="ln rv"></span><p>'+sub+'</p></div></div>';

/* ----- router ----- */
const app=document.getElementById("app");
const themeToggle=document.getElementById("themeToggle");
const menuToggle=document.getElementById("menuToggle");
const mainNav=document.getElementById("mainNav");
function setTheme(theme){
  document.documentElement.setAttribute("data-theme",theme);
  themeToggle.textContent=theme==="dark"?"☾":"☀";
  themeToggle.setAttribute("aria-label","Switch to "+(theme==="dark"?"light":"dark")+" theme");
  themeToggle.title="Switch to "+(theme==="dark"?"light":"dark")+" theme";
}
try{
  const savedTheme=localStorage.getItem("kingdom-couples-theme");
  if(savedTheme==="light"||savedTheme==="dark") setTheme(savedTheme);
}catch(error){console.error("Could not load the saved color theme.",error);}
themeToggle.addEventListener("click",()=>{
  const current=document.documentElement.getAttribute("data-theme")||
    (window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const next=current==="dark"?"light":"dark";
  setTheme(next);
  try{localStorage.setItem("kingdom-couples-theme",next);}
  catch(error){console.error("Could not save the selected color theme.",error);}
});
menuToggle.addEventListener("click",()=>{
  const open=menuToggle.getAttribute("aria-expanded")!=="true";
  menuToggle.setAttribute("aria-expanded",String(open));
  menuToggle.textContent=open?"Close":"Menu";
  mainNav.classList.toggle("is-open",open);
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&menuToggle.getAttribute("aria-expanded")==="true"){
    menuToggle.setAttribute("aria-expanded","false");
    menuToggle.textContent="Menu";
    mainNav.classList.remove("is-open");
    menuToggle.focus();
  }
});
function route(){
  let p=(location.hash||"").replace(/^#/,"")||"/"; if(!pages[p]) p="/";
  const pg=pages[p];
  menuToggle.setAttribute("aria-expanded","false");
  menuToggle.textContent="Menu";
  mainNav.classList.remove("is-open");
  app.classList.remove("enter"); void app.offsetWidth;
  app.innerHTML=pg.html(); app.classList.add("enter");
  document.title=pg.title;
  document.querySelectorAll("#mainNav a").forEach(a=>{ if(a.dataset.r===p) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(pg.after) pg.after();
  window.scrollTo(0,0);
  watch(app);
}
document.querySelectorAll("[data-sym]").forEach(el=>{el.innerHTML=symSVG(); if(el.hasAttribute("data-big")) el.style.display="block";});
document.getElementById("yr").textContent=new Date().getFullYear();
window.addEventListener("hashchange",route);
route();
</script>
